{% extends "base.html" %}

{% block content %}
<!-- Repair Request Page Header -->
<section class="page-header">
    <div class="section-container">
        <h1>REQUEST REPAIR SERVICE</h1>
        <p>Fill the details below and send us on WhatsApp</p>
    </div>
</section>

<!-- Repair Form Section with Image -->
<section class="repair-section">
    <div class="section-container">
        <div class="repair-container">
            <div class="form-wrapper">
                <form id="repairForm" class="repair-form">
                    <!-- Customer Name -->
                    <div class="form-group">
                        <input 
                            type="text" 
                            id="customerName" 
                            name="customerName" 
                            placeholder="Your Name" 
                            required>
                        <span class="error-message" id="nameError"></span>
                    </div>
                    
                    <!-- Phone Number -->
                    <div class="form-group">
                        <input 
                            type="tel" 
                            id="phoneNumber" 
                            name="phoneNumber" 
                            placeholder="Your Phone Number" 
                            pattern="[0-9\-\s\+]+"
                            required>
                        <span class="error-message" id="phoneError"></span>
                    </div>
                    
                    <!-- Service Selection -->
                    <div class="form-group">
                        <select id="service" name="service" required>
                            <option value="">Select Service</option>
                            <option value="TV Repair">TV Repair</option>
                            <option value="Mobile Repair">Mobile Repair</option>
                            <option value="Display Replacement">Display Replacement</option>
                            <option value="Software Problem">Software Problem</option>
                            <option value="Charging Problem">Charging Problem</option>
                            <option value="Remote">Remote Sales</option>
                            <option value="Sound Problem">Sound Problem</option>
                            <option value="Electronics Repair">Electronics Repair</option>
                            <option value="Other">Other</option>
                        </select>
                        <span class="error-message" id="serviceError"></span>
                    </div>
                    
                    <!-- Problem Description -->
                    <div class="form-group">
                        <textarea 
                            id="problem" 
                            name="problem" 
                            placeholder="Describe the Problem" 
                            rows="3" 
                            required></textarea>
                        <span class="error-message" id="problemError"></span>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-success btn-submit">
                        💬 SEND REQUEST ON WHATSAPP
                    </button>
                </form>
            </div>
            
            <div class="repair-visual">
                <div class="repair-image">
                    <img src="{{ url_for('static', filename='images/repair-service.png') }}"
                         alt="Technician repairing a mobile phone"
                         class="technician-image">
                </div>
                <p class="repair-note">📱 Your message will open in WhatsApp.<br>Just click and to share with us.</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
